name: Lint scripts

on:
  push:
    paths: ["scripts/**", ".github/workflows/lint-scripts.yml"]
  pull_request:
    paths: ["scripts/**", ".github/workflows/lint-scripts.yml"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax check
        run: |
          set -e
          for f in scripts/*.sh scripts/lib/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: Python syntax check
        run: python3 -I -m py_compile scripts/lib/colorsync.py

      - name: Validate plist
        run: |
          sudo apt-get install -y -qq libxml2-utils
          xmllint --noout scripts/lib/display-override.plist

      # Advisory until the first run shows what shellcheck reports on these macOS-only scripts.
      - name: ShellCheck
        continue-on-error: true
        run: shellcheck -S warning -x scripts/*.sh scripts/lib/*.sh
